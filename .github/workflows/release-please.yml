on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/release-please-config.json
          manifest-file: .release-please/.release-please-manifest.json

  zip:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    steps:
        - uses: actions/checkout@v4
        
        - run: |
            MOD_NAME=$(cat src/manifest.json | jq -r '.name')
            echo "MOD_NAME=$MOD_NAME" >> $GITHUB_ENV

            mkdir --parents "mods-unpacked/koki-$MOD_NAME"
            mv manifest.json mod_main.gd src/* "mods-unpacked/koki-$MOD_NAME/"
            zip -r "$MOD_NAME-${{ needs.release-please.outputs.tag_name }}.zip" mods-unpacked
          
        - uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            files: ${{env.MOD_NAME}}-${{ needs.release-please.outputs.tag_name }}.zip
